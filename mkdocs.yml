site_name: sablier-flow
site_description: Synthetic alternative-history generation for backtest overfitting detection + calibrated forward forecasting for deployment
site_url: https://docs.sablier.ai
site_author: Sablier
copyright: Copyright &copy; Sablier — code under Apache 2.0, docs under CC BY 4.0
repo_url: https://github.com/sablier-ai/sablier-flow
repo_name: sablier-ai/sablier-flow
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://sablier.ai
      name: sablier.ai
    - icon: fontawesome/solid/envelope
      link: mailto:team@sablier.ai
      name: team@sablier.ai

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Examples:
      - Getting started: examples/00_getting_started.ipynb
      - Backtest robustness (per-strategy overfit_score): examples/01_backtest_robustness.ipynb
      - TSTR predictive rank: examples/02_tstr_predictive_rank.ipynb
      - Memorization audit: examples/03_memorization_audit.ipynb
  - SDK reference: SDK.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - codehilite
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang: en
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false                  # ship outputs as-saved; don't re-run on build
      include_source: true
      ignore_h1_titles: true
      theme: auto

# Strict mode would fail the build on warnings; we let warnings through
# for now because a few links cross outside the docs/ tree (notebook
# under examples/, API auto-gen pages). Flip to strict once those are
# either copied into docs/ at build time or rendered via mkdocs-jupyter.
strict: false
