name: deploy-docs

# Auto-deploys https://docs.sablier.ai on every push to main that touches
# the documentation tree. Pushes to other branches deploy a Vercel preview
# (a one-off *.vercel.app URL) so a PR author can review their rendering
# before merge. Manual ad-hoc runs via the Actions tab are also supported.

on:
  push:
    branches: [main, dev]
    paths:
      - docs/**
      - examples/00_getting_started.ipynb
      - mkdocs.yml
      - scripts/build_docs.sh
      - vercel.json
      - .github/workflows/docs.yml
  workflow_dispatch:
    inputs:
      target:
        description: production (docs.sablier.ai) or preview (*.vercel.app)
        type: choice
        options: [production, preview]
        default: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID:     ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install mkdocs build deps
        run: |
          python -m pip install --upgrade pip
          # Pinned exact-version because mkdocs-jupyter has drifted in the
          # past on minor bumps and broken anchor generation. Bump
          # deliberately when you want a newer build.
          pip install "mkdocs-material==9.6.*" "mkdocs-jupyter==0.25.*"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Decide deploy target
        id: target
        run: |
          # Production deploys come from main pushes and from manual runs
          # with target=production. Everything else is a preview.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_prod=${{ github.event.inputs.target == 'production' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build mkdocs site
        run: bash scripts/build_docs.sh

      # We deploy from inside ./site so the Vercel CLI treats it as a
      # static upload — it doesn't re-run vercel.json's buildCommand
      # (that would either re-build needlessly or look for source files
      # that don't exist next to site/). No --prebuilt flag because we
      # never produced a .vercel/output structure; this is a plain
      # static-site upload of the mkdocs output.
      - name: Deploy to Vercel
        id: deploy
        working-directory: site
        run: |
          if [ "${{ steps.target.outputs.is_prod }}" = "true" ]; then
            URL=$(vercel deploy --prod --token "$VERCEL_TOKEN" --yes --scope sablier-ai)
          else
            URL=$(vercel deploy        --token "$VERCEL_TOKEN" --yes --scope sablier-ai)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "deployed: $URL"

      - name: Summarize
        if: always()
        run: |
          {
            echo "### docs deploy"
            echo ""
            echo "- target: ${{ steps.target.outputs.is_prod == 'true' && '**production (docs.sablier.ai)**' || 'preview' }}"
            echo "- url:    ${{ steps.deploy.outputs.url || '(failed before deploy)' }}"
            echo "- commit: \`${{ github.sha }}\` on \`${{ github.ref }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
