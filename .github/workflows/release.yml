name: release

# Publishes to PyPI via Trusted Publishing (OIDC) — no token/secret.
# Fires when a GitHub Release is published; the tag (vX.Y.Z) supplies the version.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # REQUIRED for PyPI trusted publishing (OIDC)

jobs:
  pypi-publish:
    name: Build + publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi      # must match the PyPI trusted-publisher environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
