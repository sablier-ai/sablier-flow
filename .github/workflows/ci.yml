name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps (no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,validation]'

      - name: ruff check
        run: ruff check src tests

      - name: mypy
        run: mypy src

  unit-tests:
    name: Unit tests (CPU, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with CPU torch
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel to keep CI fast; GPU tests run in gpu-ci.yml
          pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          # mamba-ssm needs CUDA at install time; skip on CI, vendor CPU stub
          pip install -e '.[dev,validation,adapters-backtrader,adapters-vectorbt]'

      - name: pytest
        run: pytest tests/unit -v --tb=short -m "not gpu and not integration"

      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml

  property-tests:
    name: Property-based tests (hypothesis)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,validation]'

      - name: pytest property
        # Property-based tests are not yet written (tests/property/ is
        # empty for v0.0.x). When the directory is empty pytest exits 5
        # ("no tests collected"). Treat that as success — once tests land
        # they'll just start running.
        run: pytest tests/property -v --tb=short || [ $? -eq 5 ]

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check wheel does NOT contain server/
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel built"
          with zipfile.ZipFile(wheels[0]) as z:
              bad = [n for n in z.namelist() if n.startswith("server/") or "server/" in n]
              if bad:
                  print("FAIL: server/ files leaked into wheel:", bad)
                  sys.exit(1)
              print("OK: no server/ files in wheel")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
