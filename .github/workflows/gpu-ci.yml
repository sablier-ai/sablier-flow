name: gpu-ci

# GPU-bound integration tests. Gated to:
# - Tagged releases (must pass before any wheel publishes)
# - Manual dispatch
# - Weekly cron (catches GCP / NVIDIA driver drift)
#
# Runs on a self-hosted A3-highgpu-1g (H100) runner with CC mode enabled.
# Register the runner via GitHub repo settings + the infra/runner-image
# bootstrap (TBD — Workstream D real impl).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

permissions:
  contents: read
  id-token: write

jobs:
  gpu-tests:
    name: GPU integration tests (H100 CC mode)
    runs-on: [self-hosted, gpu, h100-cc]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (with core extra)
        run: |
          python -m pip install --upgrade pip
          # mamba-ssm + causal-conv1d should be pre-installed on the runner image
          # (built once, see infra/runner-image/)
          pip install -e '.[core,dev,validation,adapters-backtrader,adapters-vectorbt]'

      # ------------------------------------------------------------------
      # Hardware sanity — fails fast if the runner isn't actually CC-enabled
      # ------------------------------------------------------------------

      - name: Smoke test — mamba-ssm under CC mode
        run: |
          python - <<'PY'
          import torch
          from mamba_ssm import Mamba
          # Risk #1 from the workstream plan: kernel-compat check on H100 CC.
          # If this fails, the entire TEE deploy is blocked.
          assert torch.cuda.is_available(), "no CUDA on this runner"
          cap = torch.cuda.get_device_capability()
          assert cap[0] >= 9, f"expected sm_90+ (H100); got sm_{cap[0]}{cap[1]}"
          m = Mamba(d_model=64, d_state=16, d_conv=4, expand=2).cuda()
          x = torch.randn(1, 32, 64, device="cuda")
          y = m(x)
          assert y.shape == x.shape
          print(f"OK: mamba-ssm runs on sm_{cap[0]}{cap[1]}")
          PY

      - name: Confidential Compute attestation report presence
        run: |
          # In a real CC VM, the SEV-SNP firmware exposes the attestation
          # report under /sys/kernel/config/tsm/report/. Probe for it;
          # fail soft on dev hardware so this workflow stays runnable
          # against a non-CC GPU runner.
          if [ -d /sys/kernel/config/tsm/report ]; then
            echo "OK: SEV-SNP attestation interface present"
          else
            echo "::warning::No SEV-SNP attestation interface (non-CC runner). Workstream D real impl: this should be FATAL."
          fi

      # ------------------------------------------------------------------
      # Test suites
      # ------------------------------------------------------------------

      - name: Unit tests (GPU-marked)
        run: pytest tests/unit -v -m "gpu" --tb=short

      - name: Integration tests (in-process attestation roundtrip)
        run: pytest tests/integration -v -m "integration and not slow" --tb=short

      - name: Attestation handshake (fake-for-dev)
        # Same suite already runs in ci.yml on CPU; re-run here to catch
        # any GPU-specific path that triggered after import.
        run: pytest tests/integration/test_attestation_handshake.py tests/integration/test_signed_attestation.py -v --tb=short

      - name: TEE-side mock job — real torch pipeline
        # Mocks Cloud Tasks dispatch; exercises run_job_real end-to-end
        # against an actual GPU. The runner produces a real
        # GenerationResult; encrypt_result + customer-side decrypt
        # roundtrips it.
        run: pytest tests/integration/test_client_end_to_end.py -v --tb=short
